<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders · OrderEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="notification.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="order.css">
</head>
<body class="dash-body">

  <nav class="navbar">
    <div class="container">
      <div class="brand"><span class="brand-order">Order</span><span class="brand-ease">Ease</span></div>
      <div class="nav-links">
        <a href="catalogue.html">Catalogue</a>
        <a href="myOrders.html" class="active">My Orders</a>
        <a href="wallet.html">Wallet</a>
        <a href="returnRequest.html">Returns</a>
        <a href="#" id="logoutLink">Log out</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="dash-header">
      <h1>My Orders</h1>
      <p>Track the status of everything you've ordered.</p>
    </div>

    <div class="filter-bar" style="margin-bottom: var(--sp-5);">
      <input type="text" class="search-input" id="orderSearchInput" placeholder="Search by order number or status...">
    </div>

    <div id="ordersList"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <h3>No orders yet</h3>
      <p>Once you place an order, it'll show up here.</p>
      <a href="catalogue.html" class="btn btn-primary" style="margin-top: var(--sp-4);">Browse catalogue</a>
    </div>
  </div>

  <div class="toast-stack"></div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="myOrders.js"></script>
  <script src="notification.js"></script>
</body>
</html>
