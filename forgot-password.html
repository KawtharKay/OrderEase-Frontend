<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password · OrderEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <div class="auth-bg">
    <div class="auth-card" style="text-align:center;">
      <a href="index.html" class="auth-logo" style="display:block;">Order<span>Ease</span></a>

      <!-- STEP 1 — request a code -->
      <div id="requestStep">
        <h1>Forgot your password?</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset code.</p>

        <div class="form-error" id="request-form-error"></div>

        <form id="request-form" novalidate>
          <div class="form-group">
            <label for="requestEmail">Email address</label>
            <input type="email" id="requestEmail" class="form-input" placeholder="Enter your email" autocomplete="email">
            <div class="field-error" id="requestEmail-error"></div>
          </div>

          <button type="submit" class="btn-submit" id="request-btn">
            <span id="request-btn-text">Send reset code</span>
            <span class="spinner" id="request-btn-spinner"></span>
          </button>
        </form>

        <p class="auth-switch" style="margin-top: var(--sp-5);">
          Remembered your password? <a href="login.html">Sign in</a>
        </p>
      </div>

      <!-- STEP 2 — enter code + new password -->
      <div id="resetStep" style="display:none;">
        <h1>Enter your reset code</h1>
        <p class="auth-subtitle">Check your email for the 6-digit code, then set a new password.</p>

        <div class="form-error" id="reset-form-error"></div>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label for="resetEmail">Email address</label>
            <input type="email" id="resetEmail" class="form-input" placeholder="Enter your email" autocomplete="email">
            <div class="field-error" id="resetEmail-error"></div>
          </div>

          <div class="form-group">
            <label for="resetCode">Reset code</label>
            <input type="text" id="resetCode" class="form-input" placeholder="6-digit code" inputmode="numeric" maxlength="6" style="text-align:center; letter-spacing:6px; font-size:1.2rem;">
            <div class="field-error" id="resetCode-error"></div>
          </div>

          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" autocomplete="new-password">
            <div class="field-error" id="newPassword-error"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your new password" autocomplete="new-password">
            <div class="field-error" id="confirmPassword-error"></div>
          </div>

          <button type="submit" class="btn-submit" id="reset-btn">
            <span id="reset-btn-text">Reset password</span>
            <span class="spinner" id="reset-btn-spinner"></span>
          </button>
        </form>

        <p class="auth-switch" style="margin-top: var(--sp-5);">
          Didn't get a code? <a href="#" id="resendCodeLink">Resend code</a>
        </p>
      </div>

    </div>
  </div>

  <div class="toast-stack"></div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("request-form").addEventListener("submit", handleRequestCode);
      document.getElementById("reset-form").addEventListener("submit", handleResetPassword);
      document.getElementById("resendCodeLink").addEventListener("click", handleResendCode);
    });

    async function handleRequestCode(e) {
      e.preventDefault();
      clearStepErrors("request");

      const email = document.getElementById("requestEmail").value.trim();
      if (!email) {
        document.getElementById("requestEmail-error").textContent = "Email is required.";
        return;
      }

      const btn = document.getElementById("request-btn");
      setStepLoading("request", true);

      try {
        const result = await Api.post("/Auth/forgot-password", { email }, { auth: false });
        showToast(result.message || "Reset code sent.", "success");

        // Move to step 2, carrying the email across so they don't retype it
        document.getElementById("resetEmail").value = email;
        document.getElementById("requestStep").style.display = "none";
        document.getElementById("resetStep").style.display = "block";
      } catch (err) {
        showFormError("request-form-error", err.message);
      } finally {
        setStepLoading("request", false);
      }
    }

    async function handleResendCode(e) {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();
      if (!email) {
        document.getElementById("resetEmail-error").textContent = "Enter your email first.";
        return;
      }

      try {
        const result = await Api.post("/Auth/forgot-password", { email }, { auth: false });
        showToast(result.message || "A new code has been sent.", "success");
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      clearStepErrors("reset");

      const email = document.getElementById("resetEmail").value.trim();
      const token = document.getElementById("resetCode").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      let hasError = false;
      if (!email) { document.getElementById("resetEmail-error").textContent = "Email is required."; hasError = true; }
      if (!token || token.length !== 6) { document.getElementById("resetCode-error").textContent = "Enter the 6-digit code."; hasError = true; }
      if (newPassword.length < 6) { document.getElementById("newPassword-error").textContent = "Password must be at least 6 characters."; hasError = true; }
      if (confirmPassword !== newPassword) { document.getElementById("confirmPassword-error").textContent = "Passwords do not match."; hasError = true; }
      if (hasError) return;

      setStepLoading("reset", true);

      try {
        const result = await Api.post("/Auth/reset-password", { email, token, newPassword, confirmPassword }, { auth: false });
        showToast(result.message || "Password reset successfully.", "success");
        setTimeout(() => { window.location.href = "login.html"; }, 1200);
      } catch (err) {
        showFormError("reset-form-error", err.message);
      } finally {
        setStepLoading("reset", false);
      }
    }

    function clearStepErrors(step) {
      const banner = document.getElementById(`${step}-form-error`);
      banner.textContent = ""; banner.classList.remove("show");
      document.querySelectorAll(`#${step}Step .field-error, #${step}-form .field-error`).forEach(el => el.textContent = "");
    }

    function showFormError(bannerId, message) {
      const banner = document.getElementById(bannerId);
      banner.textContent = message;
      banner.classList.add("show");
    }

    function setStepLoading(step, isLoading) {
      const btn = document.getElementById(`${step}-btn`);
      const text = document.getElementById(`${step}-btn-text`);
      const spinner = document.getElementById(`${step}-btn-spinner`);
      btn.disabled = isLoading;
      spinner.classList.toggle("show", isLoading);
      text.style.opacity = isLoading ? "0.7" : "1";
    }
  </script>
</body>
</html>
