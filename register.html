<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · OrderEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">Order<span>Ease</span></a>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Set up an account to start ordering or supplying</p>

      <div class="form-error" id="form-error"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="nameInput">Full name</label>
          <input type="text" id="nameInput" class="form-input" placeholder="Enter your full name" autocomplete="name" maxlength="100">
          <div class="field-error" id="name-error"></div>
        </div>

        <div class="form-group">
          <label for="emailInput">Email address</label>
          <input type="email" id="emailInput" class="form-input" placeholder="Enter your email" autocomplete="email">
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="phoneInput">Phone number</label>
          <input type="tel" id="phoneInput" class="form-input" placeholder="080XXXXXXXX" autocomplete="tel" maxlength="14">
          <div class="field-error" id="phone-error"></div>
        </div>

        <div class="form-group">
          <label for="addressInput">Delivery address</label>
          <input type="text" id="addressInput" class="form-input" placeholder="Enter your address" autocomplete="street-address" maxlength="80">
          <div class="field-error" id="address-error"></div>
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <div class="input-wrap">
            <input type="password" id="passwordInput" class="form-input" placeholder="At least 6 characters" autocomplete="new-password">
            <button type="button" class="toggle-password" id="togglePassword">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
          <div class="field-error" id="password-error"></div>
        </div>

        <button type="submit" class="btn-submit" id="register-btn">
          <span id="btn-text">Create Account</span>
          <span class="spinner" id="btn-spinner"></span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <div class="toast-stack"></div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
</body>
</html>
