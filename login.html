<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · OrderEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">Order<span>Ease</span></a>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage your orders, deliveries and wallet</p>

      <div class="form-error" id="form-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="emailInput">Email address</label>
          <input type="email" id="emailInput" class="form-input" placeholder="Enter your email" autocomplete="email">
          <div class="field-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="passwordInput">Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePassword">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
          <div class="field-error" id="password-error"></div>
        </div>

        <button type="submit" class="btn-submit" id="login-btn">
          <span id="btn-text">Sign In</span>
          <span class="spinner" id="btn-spinner"></span>
        </button>
      </form>

      <p class="auth-switch">New to OrderEase? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <div class="toast-stack"></div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
</body>
</html>
